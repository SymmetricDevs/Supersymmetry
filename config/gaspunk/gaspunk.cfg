# Configuration file

general {
    # Makes ash require smelting nether wart instead of rotten flesh
    B:alternativeAshRecipe=false

    # Disables gas / smoke / vapor clouds checking for a clear path to entities and make them only check straight distance instead
    B:fastGas=false

    # Sets the lifespan in ticks for gas clouds. The clouds themselves look like they take a bit longer to decay, but the effects no longer happen after this amount.
    I:gasLifespan=600

    # Default distance that the gas cloud travels. The value appears to be an estimate for the radius in meters. I am not the original developer, so I'm not completely sure.
    I:maxPropagationDistance=10

    # The items which ID's are added here will be considered as gas masks when breathing gas
    # You can specify entire armor sets by separating items with "&" in a single entry. Using "*" instead of an item id will match anything.
    # Examples: "minecraft:diamond_helmet", "minecraft:golden_helmet&*&minecraft:chainmail_leggings"
    S:otherGasMasks <
        techguns:t3_power_helmet=0.9
        techguns:t3_combat_helmet=0.85
        techguns:t4_power_helmet=1.0
        techguns:t1_scout_helmet=0.3
        susy:susy_armor:4&susy:susy_armor:5&*&*=0.6
        susy:susy_armor:9&susy:susy_armor:10&*&*=0.65
        susy:susy_armor:4&susy:susy_armor:8&*&*=0.75
        susy:susy_armor:9&susy:susy_armor:13&*&*=0.8
        susy:susy_armor:14&susy:susy_armor:15&*&*=0.9
        susy:susy_armor:0=0.2
        susy:susy_armor:2&susy:susy_armor:3&*&*=0.3
        techguns:t3_power_helmet&techguns:t3_power_chestplate&*&*=1.3
        techguns:t4_power_helmet&techguns:t4_power_chestplate&*&*=1.6
        techguns:t3_power_helmet&techguns:t3_power_chestplate&techguns:t3_power_leggings&techguns:t3_power_boots=2.0
        techguns:t4_power_helmet&techguns:t4_power_chestplate&techguns:t4_power_leggings&techguns:t4_power_boots=3.0
        techguns:hazmat_helmet&techguns:hazmat_chestplate&techguns:hazmat_leggings&techguns:hazmat_boots=1.0
		techguns:t2_commando_helmet=0.6
		techguns:t2_commando_helmet&techguns:t2_commando_chestplate&*&*=0.8
		techguns:t2_commando_helmet&techguns:t2_commando_chestplate&techguns:t2_commando_leggings&techguns:t2_commando_boots=0.9
		techguns:t3_exo_helmet=0.9
		techguns:t3_exo_helmet&techguns:t3_exo_chestplate&*&*=1.3
		techguns:t3_exo_helmet&techguns:t3_exo_chestplate&techguns:t3_exo_leggings&techguns:t3_exo_boots=2.0
		techguns:steam_helmet=0.8
		techguns:steam_helmet&techguns:steam_chestplate&*&*=1.1
		techguns:steam_helmet&techguns:steam_chestplate&techguns:steam_leggings&techguns:steam_boots=1.8
     >

    client {
        # Display a custom overlay when inside a gas cloud
        # combine with useShaders for a dynamically generated overlay
        B:renderGasOverlays=false

        # Enables the use of shaders to render the gas overlay
        # won't do anything if renderGasOverlays is set to false
        B:useShaders=true
    }

}


